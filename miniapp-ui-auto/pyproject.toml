[project]
name = "miniapp-ui-auto"
version = "0.1.0"
description = "Airtest-oriented miniapp UI automation MVP"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0"
]

[project.scripts]
miniapp-ui-auto = "miniapp_ui_auto.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
